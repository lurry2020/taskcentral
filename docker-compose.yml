services:
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-taskcentral}-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Task Central}
      APP_ENV: ${APP_ENV:-production}
      TASKCENTRAL_VERSION: ${TASKCENTRAL_VERSION:-1.1.0}
      CHANGELOG_PATH: /app/CHANGELOG.md
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/taskcentral.db}
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8484}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /logs
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEMO_MODE: ${DEMO_MODE:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me-on-first-run}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-168}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./MANUAL.md:/app/MANUAL.md:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-taskcentral}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8484}:80"
    environment:
      FRONTEND_LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      FRONTEND_LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - ./logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
