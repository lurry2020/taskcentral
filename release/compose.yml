services:
  backend:
    image: ${TASKCENTRAL_IMAGE_PREFIX}/taskcentral-backend:${TASKCENTRAL_VERSION}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Task Central}
      APP_ENV: production
      TASKCENTRAL_VERSION: ${TASKCENTRAL_VERSION}
      TASKCENTRAL_RELEASE_REPOSITORY: ${TASKCENTRAL_RELEASE_REPOSITORY:-lurry2020/taskcentral}
      CHANGELOG_PATH: /app/CHANGELOG.md
      DATABASE_URL: sqlite:////data/taskcentral.db
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8484}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /logs
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      # Older releases generated SECRET_KEY but did not have SETUP_ACCESS_TOKEN.
      # Use that existing random secret for the one-time compatibility upgrade;
      # install.sh/update.sh persist a dedicated setup token going forward.
      SETUP_ACCESS_TOKEN: ${SETUP_ACCESS_TOKEN:-${SECRET_KEY:-}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-168}
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    image: ${TASKCENTRAL_IMAGE_PREFIX}/taskcentral-frontend:${TASKCENTRAL_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8484}:80"
    environment:
      FRONTEND_LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      FRONTEND_LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - ./logs:/logs
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
